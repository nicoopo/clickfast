name: clickfast

services:
  web:
    image: ${REGISTRY_USER}/clickfast-web:${TAG}
    ports:
      - "${WEB_PORT}:80"
    networks: [clickfast-net]

  api:
    image: ${REGISTRY_USER}/clickfast-api:${TAG}
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "${API_PORT}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [clickfast-net]

  stats-api:
    image: ${REGISTRY_USER}/clickfast-stats-api:${TAG}
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "${STATS_PORT}:5000"
    depends_on:
      db:
        condition: service_healthy
    networks: [clickfast-net]

  db:
    image: postgres:17.2-alpine3.20
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - clickfast-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks: [clickfast-net]

  adminer:
    image: adminer:4.8.1
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db
    networks: [clickfast-net]

volumes:
  clickfast-data:
    name: clickfast-data

networks:
  clickfast-net:
    name: clickfast-net
