# Stack de production, jouée sur vm-prod dans /srv/clickfast.
# Rien ne se construit ici : l'image vient de Docker Hub, la version est choisie de l'extérieur.
#   cd /srv/clickfast && TAG=<sha du commit> docker compose up -d
services:
  scores-api:
    container_name: scores-api
    image: ${REGISTRY_USER}/clickfast-api:${TAG:?TAG manquant, lancer avec TAG=<sha>}
    environment:
      DB_HOST: scores-db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "3000:3000"
    depends_on:
      scores-db:
        condition: service_healthy
    restart: unless-stopped

  scores-db:
    container_name: scores-db
    image: postgres:17.2-alpine3.20
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - scores-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  scores-data:
