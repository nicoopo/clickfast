# Stack de production, jouée sur vm-prod dans /srv/clickfast.
# Rien ne se construit ici : l'image vient de Docker Hub, la version est choisie de l'extérieur.
#   cd /srv/clickfast && TAG=<sha du commit> docker compose up -d
services:
  scores-api:
    container_name: scores-api
    image: ${REGISTRY_USER}/clickfast-api:${TAG:?TAG manquant, lancer avec TAG=<sha>}
    environment:
      DB_HOST: scores-db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "3000:3000"
    depends_on:
      scores-db:
        condition: service_healthy
    restart: unless-stopped

  scores-db:
    container_name: scores-db
    image: postgres:17.2-alpine3.20
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - scores-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Surveillance : même réseau que l'API, Prometheus la joint par son nom de service.
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:12.2.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant dans .env}
      # Le pilote d'astreinte lit le tableau de bord sans compte ; modifier reste réservé à l'admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/clickfast.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  scores-data:
