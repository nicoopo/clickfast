# Modèle : copier en todo-secret.yaml (ignoré par git), remplacer les valeurs, puis
#   kubectl apply -f k8s/todo-secret.yaml
# Le vrai Secret n'est jamais commité : ses valeurs ne vivent que dans le cluster.
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  namespace: todo
type: Opaque
stringData:
  DB_NAME: clickfast
  DB_USER: changeme
  DB_PASSWORD: changeme
