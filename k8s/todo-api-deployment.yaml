# L'API de scores ClickFast (nommée todo-api pour tenir le contrat du sujet).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          # Un sha précis, jamais latest : la pipeline le remplace à chaque déploiement.
          image: nicopoo/clickfast-api:ef186dea176c978eb3fa4c46621c43ef8fe1b23d
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret
          # Limite connue : /health ne touche pas la base. Les deux sondes disent "le serveur HTTP écoute",
          # jamais "l'application rend le service" (base coupée : pod Ready, et pourtant 503).
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
