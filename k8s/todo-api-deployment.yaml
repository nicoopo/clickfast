# L'API de scores ClickFast (nommée todo-api pour tenir le contrat du sujet).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          # Un sha précis, jamais latest : la pipeline le remplace à chaque déploiement.
          image: nicopoo/clickfast-api:357ce8bd9dac0f0ac4e1c8822486e85b1fe481fa
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-secret
