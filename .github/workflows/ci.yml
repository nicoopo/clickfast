name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  api-test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2-alpine3.20
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Les tests attendent que la base soit prête, sinon ils échouent une fois sur trois.
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DB_HOST: localhost
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: [test, api-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, api, stats-api]
    # On ne publie que ce qui est fusionné sur main, jamais une pull request.
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    # Ce job tourne chez toi, à côté de vm-prod. Jamais sur une pull request :
    # la machine n'exécute que ce qui a été fusionné sur main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults:
      run:
        # Runner Windows : le bash de Git fournit ssh-agent, ssh, scp et curl.
        shell: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc -eo pipefail {0}'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Preuve que le job tourne sur ta machine
        run: hostname && docker ps --format '{{.Names}}'

      - name: Déployer sur vm-prod
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          # La clé vit dans l'agent, en mémoire, jamais sur le disque du runner.
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add - 2> /dev/null

          OPTS=(-o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new
                -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts")
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          scp "${OPTS[@]}" -P "$DEPLOY_PORT" deploy/compose.yml "$TARGET:/srv/clickfast/compose.yml"
          ssh "${OPTS[@]}" -p "$DEPLOY_PORT" "$TARGET" \
            "cd /srv/clickfast && REGISTRY_USER='$REGISTRY_USER' TAG='$TAG' docker compose up -d --remove-orphans"

      - name: Vérifier que /health répond
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://$DEPLOY_HOST:3000/health"; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::/health ne répond pas 60 s après le déploiement de $TAG"
          exit 1
