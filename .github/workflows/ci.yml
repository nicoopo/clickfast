name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  api-test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2-alpine3.20
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Les tests attendent que la base soit prête, sinon ils échouent une fois sur trois.
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DB_HOST: localhost
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: [test, api-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, api, stats-api]
    # On ne publie que ce qui est fusionné sur main, jamais une pull request.
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # vm-prod tourne sur un poste ARM : l'image doit exister en arm64, pas seulement en amd64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast-${{ matrix.service }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    # Ce job tourne chez toi, à côté du cluster. Jamais sur une pull request :
    # la machine n'exécute que ce qui a été fusionné sur main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults:
      run:
        # Runner Windows : chemin court sans espace, le runner coupe "C:\Program Files" et ignore les guillemets,
        # et "bash" tout court tomberait sur celui de WSL (System32), premier dans le PATH.
        shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    env:
      # Aucun secret de plus : kubectl lit le kubeconfig que k3d a écrit sur ce poste.
      # Le contexte est nommé pour ne jamais viser le mauvais cluster par accident.
      KUBE: kubectl --context k3d-todo-cluster -n todo
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast-api:${{ github.sha }}
    steps:
      - name: Mettre à jour l'image du Deployment
        run: $KUBE set image deployment/todo-api todo-api="$IMAGE"

      - name: Attendre que le rollout converge
        # Un tag introuvable ou un pod qui ne démarre pas : le job échoue au lieu de déclarer un faux succès.
        run: $KUBE rollout status deployment/todo-api --timeout=120s

      - name: Vérifier le service par l'Ingress
        run: |
          $KUBE get pods -l app=todo-api -o wide
          curl -fsS -H "Host: todo.localhost" http://localhost:8080/health
